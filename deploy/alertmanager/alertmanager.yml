route:
  receiver: not-configured
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Safe sink. Replace via ALERTMANAGER_CONFIG_FILE with an untracked config
  # and set ALERTMANAGER_RECEIVER in .env.prod; readiness reports the omission.
  - name: not-configured
