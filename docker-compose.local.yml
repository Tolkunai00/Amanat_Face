name: amanat-face

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PRODUCTION: "0"
      ENVIRONMENT: development
      DATABASE_URL: ""
      SQLITE_TEST_MODE: "1"
      DB_NAME: school-local.db
      AUTO_MIGRATE: "1"
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      APP_AUTO_PORT: "0"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./face_database:/app/face_database
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      - model_cache:/home/app/.insightface
    command: [uvicorn, "school_face_id.main:app", --host, 0.0.0.0, --port, "8080", --reload]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [backend_network]

volumes:
  model_cache:

networks:
  backend_network:
    driver: bridge
